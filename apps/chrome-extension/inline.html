<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CredPivot 填充</title><link rel="stylesheet" href="inline.css"></head>
<body>
  <header><strong>CredPivot</strong><button id="close" type="button" aria-label="关闭并取消填充">×</button></header>
  <p id="site" class="site"></p>
  <p id="status" role="status" aria-live="polite">正在检查保险库连接状态…</p>
  <button id="connect" class="primary" type="button" disabled>连接与验证</button>
  <section id="choices" hidden>
    <label id="accountLabel" for="account" hidden>本次登录账号</label>
    <select id="account" hidden aria-label="本次登录账号"></select>
    <label for="search" class="sr-only">筛选候选记录</label>
    <input id="search" type="search" placeholder="搜索账号、名称或分区" autocomplete="off">
    <div id="list"></div>
    <button id="more" class="secondary" hidden>查看其他匹配的 MFA</button>
  </section>
  <button id="retry" class="secondary" hidden>重新读取候选</button>
  <footer><span>仅填充，不会提交表单</span><button id="hide" type="button">此网站隐藏图标</button></footer>
  <script type="module" src="inline.js"></script>
</body>
</html>
