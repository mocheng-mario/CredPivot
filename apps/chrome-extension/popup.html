<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CredPivot</title>
    <style>
      body { font-family: system-ui, sans-serif; min-width: 300px; padding: 12px; }
      button { width: 100%; margin-top: 8px; }
      #status { font-size: 12px; color: #555; white-space: pre-wrap; }
      #mfa { font-size: 13px; margin-top: 8px; padding: 8px; background: #f4f4f4; border-radius: 6px; }
      .ver { font-size: 11px; color: #888; }
    </style>
  </head>
  <body>
    <strong>CredPivot</strong>
    <div class="ver" id="ver"></div>
    <div id="status">未连接</div>
    <div id="mfa" hidden></div>
    <button id="connect">连接 App（需指纹）</button>
    <button id="fillLogin">填充账号密码</button>
    <button id="fillOtp">填充 MFA</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
