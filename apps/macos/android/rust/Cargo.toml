[package]
name = "credpivot-ffi-android"
version = "0.1.0-beta.5"
edition = "2021"
license = "MIT"

# 仅分开构建清单，复用同一 FFI 源码；Android 的 OpenSSL 依赖不影响 Mac 的锁文件。
[workspace]

[lib]
name = "credpivot_ffi"
crate-type = ["cdylib"]
path = "../../../../crates/credpivot-ffi/src/lib.rs"

[dependencies]
credpivot-agent = { path = "../../../../crates/agent" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Android 不提供应用可链接的系统 libcrypto，SQLCipher 必须静态携带自己的实现。
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }

[profile.release]
lto = true
codegen-units = 1
