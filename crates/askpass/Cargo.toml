[package]
name = "credpivot-askpass"
description = "OpenSSH SSH_ASKPASS helper for CredPivot (no password on disk)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "credpivot-askpass"
path = "src/main.rs"

[[bin]]
name = "credpivot-git-ssh"
path = "src/git_ssh.rs"

[[bin]]
name = "credpivot-connect"
path = "src/connect.rs"

[dependencies]
credpivot-agent = { path = "../agent" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
