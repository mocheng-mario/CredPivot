[package]
name = "credpivot-core"
description = "CredPivot vault crypto, CPVC1, OVB1 (M1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "backup"] }
tempfile = "3"
totp-rs = { version = "5", default-features = false, features = ["gen_secret", "otpauth"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha1 = "0.10"
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
url = "2.5"
regex = "1"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }

[dev-dependencies]
ovb1-structure = { path = "../ovb1-structure" }
tempfile = "3"
